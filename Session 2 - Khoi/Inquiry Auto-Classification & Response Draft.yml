    - data:
        classes:
        - id: '1'
          name: '1. Technical Support

            Keywords: internet, speed, slow, connection, Wi-Fi, router, equipment,
            blinking, red light, disconnection, outage, signal, static, noise, VoIP,
            phone dropping

            Examples:

            Connection issues

            Equipment failures

            Speed problems

            Wi-Fi problems

            VoIP quality issues

            Response Focus: Troubleshooting steps, technical verification, repair
            scheduling'
        - id: '2'
          name: '2. Billing/Payment

            Keywords: bill, charge, payment, price, fee, invoice, refund, duplicate,
            higher, increase, cost, subscription

            Examples:

            Bill amount questions

            Payment method changes

            Pricing plan inquiries

            Refund requests

            Billing errors

            Response Focus: Billing explanation, correction process, payment options/'
        - id: '1772007292883'
