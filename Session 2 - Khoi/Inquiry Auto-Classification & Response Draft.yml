            bundle, discount, upgrade, downgrade

            Examples:

            New service applications

            Plan changes

            Service cancellations

            Moving/relocation

            Bundle inquiries

            Response Focus: Application guidance, plan options, process explanation'
        instruction: 'Classify the following customer inquiry into one of these 3
          categories:


          Categories:

          - Technical Support (connection issues, equipment failures, speed problems,
          etc.)

          - Billing/Payment (bill amounts, payment methods, pricing plans, etc.)

          - Contract/Application (new applications, plan changes, cancellations, etc.)


