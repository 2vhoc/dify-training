    - data:
        code: "from datetime import datetime\n\ndef main(\n    completeness_result:\
          \ dict,\n    feasibility_result: dict,\n    impact_result: dict,\n    quality_result:\
          \ dict\n) -> dict:\n\n    try:\n        c = completeness_result[\"score\"\
          ]\n        f = feasibility_result[\"score\"]\n        i = impact_result[\"\
          score\"]\n        q = quality_result[\"score\"]\n    except:\n        c\
          \ = f = i = q = 0\n\n    weighted = (c * 0.30) + (f * 0.25) + (i * 0.25)\
          \ + (q * 0.20)\n\n    if weighted >= 80:\n        decision = \"APPROVE\"\
          \n    elif weighted >= 60:\n        decision = \"REVIEW\"\n    elif weighted\
          \ >= 40:\n        decision = \"REVISE\"\n    else:\n        decision = \"\
          REJECT\"\n\n    return {\n        \"completeness\": c,\n        \"feasibility\"\
          : f,\n        \"impact\": i,\n        \"quality\": q,\n        \"weighted_score\"\
          : round(weighted, 1),\n        \"decision\": decision,\n        \"today\"\
          : datetime.now().strftime(\"%Y-%m-%d\")\n    }"
        code_language: python3
        outputs:
          completeness:
            children: null
            type: number
          decision:
            children: null
            type: string
          feasibility:
            children: null
            type: number
          impact:
            children: null
            type: number
          quality:
            children: null
            type: number
          today:
            children: null
            type: string
          weighted_score:
            children: null
            type: number
        retry_config:
          max_retries: 3
          retry_enabled: false
          retry_interval: 1000
