          text: 'Analyze the following project proposal and extract key information.

            Document Content:

            {{{#1771987543001.text#}}}

             

            Extract and return in JSON format:

            {

              "has_executive_summary": true/false,

              "has_problem_data": true/false (look for specific numbers, percentages,
            costs),

              "has_quantified_kpis": true/false (look for measurable targets),

              "has_timeline": true/false,

              "has_budget": true/false,

              "problem_statement": "brief summary of the problem",

              "proposed_solution": "brief summary of the solution",

              "extracted_kpis": ["list of KPIs found"],

              "extracted_timeline": "timeline if found",

              "budget_amount": "budget if found"

            }


            {{#context#}}'
        reasoning_format: separated
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              budget_amount:
                description: Budget amount or financial figures mentioned in the document.
                type: string
              extracted_kpis:
                description: List of KPIs identified in the document.
                items:
                  type: string
                type: array
              extracted_timeline:
                description: Timeline or schedule extracted from the document, if
                  available.
                type: string
              has_budget:
                description: Indicates whether budget or financial allocation information
                  is provided.
                type: boolean
              has_executive_summary:
                description: Indicates whether the document contains an executive
                  summary section.
                type: boolean
              has_problem_data:
                description: True if the document includes specific numbers, percentages,
                  costs, or other quantitative problem data.
                type: boolean
              has_quantified_kpis:
                description: True if measurable KPIs or quantified targets are identified.
                type: boolean
              has_timeline:
                description: Indicates whether a timeline or schedule is mentioned.
                type: boolean
              problem_statement:
                description: Brief summary of the problem described in the document.
                type: string
              proposed_solution:
                description: Brief summary of the proposed solution.
                type: string
            required:
            - has_executive_summary
            - has_problem_data
            - has_quantified_kpis
            - has_timeline
            - has_budget
            - problem_statement
            - proposed_solution
            - extracted_kpis
