    - data:
        code: "def main(coverage_data, social_data=None) -> dict:\n    import json\n\
          \n    # ---------- SAFE PARSE ----------\n    def safe_json_load(x):\n \
          \       if isinstance(x, str):\n            try:\n                return\
          \ json.loads(x)\n            except Exception:\n                raise ValueError(\"\
          Input is string but not valid JSON\")\n        return x\n\n    coverage\
          \ = safe_json_load(coverage_data)\n    social = safe_json_load(social_data)\
          \ if social_data is not None else []\n\n    if not isinstance(coverage,\
          \ list):\n        raise ValueError(\"coverage_data must be a list of dicts\"\
          )\n\n    # ---------- BASIC COUNTS ----------\n    coverage_count = len(coverage)\n\
          \n    # ---------- PICKUP RATE ----------\n    # pickup_rate = % coverage\
          \ giữ được message (Yes + Partial)\n    retained = 0\n    for c in coverage:\n\
          \        if c.get(\"key_message_retained\") in [\"Yes\", \"Partial\"]:\n\
          \            retained += 1\n\n    pickup_rate = (retained / coverage_count\
          \ * 100) if coverage_count else 0\n\n    # ---------- SENTIMENT ----------\n\
          \    sentiment_map = {\n        \"Very Positive\": 5,\n        \"Positive\"\
          : 4,\n        \"Neutral\": 3,\n        \"Negative\": 2,\n        \"Very\
          \ Negative\": 1\n    }\n\n    sentiment_scores = [\n        sentiment_map.get(c.get(\"\
          sentiment\"), 3)\n        for c in coverage\n    ]\n\n    avg_sentiment_score\
          \ = (\n        sum(sentiment_scores) / len(sentiment_scores)\n        if\
          \ sentiment_scores else 0\n    )\n\n    # ---------- MESSAGE RETENTION ----------\n\
          \    retention_map = {\n        \"Yes\": 100,\n        \"Partial\": 50,\n\
          \        \"No\": 0\n    }\n\n    retention_scores = [\n        retention_map.get(c.get(\"\
          key_message_retained\", \"No\"), 0)\n        for c in coverage\n    ]\n\n\
          \    message_retention_rate = (\n        sum(retention_scores) / len(retention_scores)\n\
          \        if retention_scores else 0\n    )\n\n    # ---------- SOCIAL ENGAGEMENT\
          \ ----------\n    total_social_engagement = 0\n\n    if isinstance(social,\
          \ list):\n        for s in social:\n            engagement = s.get(\"engagement\"\
          , 0)\n            if isinstance(engagement, dict):\n                total_social_engagement\
          \ += sum(engagement.values())\n            elif isinstance(engagement, (int,\
          \ float)):\n                total_social_engagement += engagement\n\n  \
          \  # ---------- OUTPUT (MATCH DIFY OUTPUT VARS) ----------\n    return {\n\
          \        \"pickup_rate\": round(pickup_rate, 1),\n        \"avg_sentiment_score\"\
          : round(avg_sentiment_score, 2),\n        \"message_retention_rate\": round(message_retention_rate,\
          \ 1),\n        \"total_social_engagement\": total_social_engagement,\n \
          \       \"coverage_count\": coverage_count\n    }"
        code_language: python3
