        prompt_template:
        - id: f77d4686-d98d-4eee-8963-4cf5f2995c35
          role: system
          text: "\n==HET-1-CHUNK==\n# Accounting Code Selection Rules\n\n## Decision\
            \ Tree Approach\n\n### Step 1: Is it a capital purchase?\n\n```\nIs the\
            \ item:\n- Over 100,000 JPY AND\n- Has useful life > 1 year?\n       \
            \ |\n    YES → Use 42xxx codes (Asset Purchases)\n        |\n    NO  →\
            \ Continue to Step 2\n```\n\n### Step 2: What is the primary purpose?\n\
            \n```\nPrimary Purpose:\n    |\n    ├── IT/Software related → Use 43xxx\
            \ codes\n    |       ├── Software purchase/subscription → 43201\n    |\
            \       └── Hardware maintenance → 43301\n    |\n    ├── Personnel related\
            \ → Use 41301 (Temporary Personnel)\n    |\n    ├── Facility related →\
            \ Use 45xxx codes\n    |       ├── Rent/lease → 45101\n    |       └──\
            \ Building maintenance → 45201\n    |\n    └── General operational → Use\
            \ 44xxx codes\n            ├── Travel → 44101\n            ├── Training\
            \ → 44201\n            ├── Daily transport/communication → 44301\n   \
            \         ├── Entertainment → 44401\n            ├── Professional services\
            \ → 44501\n            └── Marketing → 44601\n```\n\n### Step 3: Specific\
            \ Category Selection (Common Confusion Areas)\n==HET-1-CHUNK==\n## Travel\
            \ vs Training (44101 vs 44201)\n\n**Key Question:** What is the PRIMARY\
            \ purpose of the expense?\n\n| Scenario | Code | Rationale |\n|----------|------|-----------|\n\
            | Attending seminar as PARTICIPANT | 44201 | Learning is primary purpose\
            \ |\n| Traveling to GIVE presentation | 44101 | Travel is primary purpose\
            \ |\n| Conference with learning + networking | 44201 | Learning is primary\
            \ |\n| Client visit for project work | 44101 | Travel for business activity\
            \ |\n\n**Special Case - Conference with Both:**\n- Registration fee →\
            \ 44201 (Training)\n- Travel costs → 44101 (Travel)\n- Split the expense\
            \ by purpose\n==HET-1-CHUNK==\n## Equipment vs Consumables (42101 vs 41101)\n\
            \n**Key Questions:**\n1. What is the unit price?\n2. What is the expected\
            \ useful life?\n\n| Unit Price | Useful Life | Code | Category |\n|------------|-------------|------|----------|\n\
            | < 10,000 JPY | < 1 year | 41101 | Consumables |\n| 10,000 - 100,000\
            \ JPY | < 1 year | 41101 | Consumables |\n| 10,000 - 100,000 JPY | > 1\
            \ year | 42101 | Equipment |\n| > 100,000 JPY | Any | 42101 | Equipment\
            \ |\n\n**Examples:**\n- Keyboard (8,000 JPY) → 41101 (Consumables)\n-\
            \ Monitor (35,000 JPY, 3-year life) → 42101 (Equipment)\n- Laptop (150,000\
            \ JPY) → 42101 (Equipment)\n- Printer ink (5,000 JPY) → 41101 (Consumables)\n\
            ==HET-1-CHUNK==\n## Maintenance vs Software (43301 vs 43201)\n\n**Key\
            \ Question:** Is it for HARDWARE or SOFTWARE?\n\n| Item | Code | Rationale\
            \ |\n|------|------|-----------|\n| Server hardware maintenance | 43301\
            \ | Physical equipment |\n| Software maintenance fee | 43201 | Software\
            \ related |\n| SaaS subscription | 43201 | Software service |\n| Network\
            \ equipment support | 43301 | Physical equipment |\n| Cloud hosting (AWS,\
            \ Azure) | 43201 | Software/service |\n\n**Combined Maintenance Contracts:**\n\
            - If contract covers BOTH hardware + software:\n  - Split if amounts are\
            \ clear\n  - Use 43301 if hardware is primary\n  - Use 43201 if software\
            \ is primary\n==HET-1-CHUNK==\n## Consulting vs Training (44501 vs 44201)\n\
            \n**Key Question:** Is someone TEACHING us or DOING work for us?\n\n|\
            \ Scenario | Code | Rationale |\n|----------|------|-----------|\n| External\
            \ training instructor | 44201 | Teaching our employees |\n| Consultant\
            \ doing assessment | 44501 | Doing work for us |\n| Workshop facilitation\
            \ | 44201 | Learning activity |\n| System implementation consulting |\
            \ 44501 | Professional service |\n| Certification prep course | 44201\
            \ | Training/education |\n==HET-1-CHUNK==\n## Common Clarification Questions\n\
            \nWhen uncertain, ask these questions:\n\n1. **What is the unit price\
            \ of the item?**\n   - Determines Equipment vs Consumables boundary\n\n\
            2. **What is the expected useful life?**\n   - >1 year suggests Equipment\
            \ or Asset\n\n3. **What is the primary purpose of the expense?**\n   -\
            \ Learning → Training\n   - Business activity → Travel or relevant operational\
            \ code\n   - Getting expert help → Professional Services\n\n4. **Is this\
            \ a recurring or one-time expense?**\n   - Recurring often suggests subscriptions\
            \ or maintenance\n   - One-time might be asset purchase or project expense\n\
            \n5. **Which department will use this?**\n   - Helps determine appropriate\
            \ budget category\n\n6. **Is this for internal use or client-facing?**\n\
            \   - Client-facing often → Entertainment or Marketing\n==HET-1-CHUNK==\n\
            ## Error Prevention Checklist\n\nBefore finalizing a code selection:\n\
            \n- [ ] Verified unit price against thresholds\n- [ ] Confirmed useful\
            \ life expectation\n- [ ] Identified primary purpose correctly\n- [ ]\
            \ Checked for similar past transactions\n- [ ] Considered if expense should\
            \ be split\n- [ ] Verified against department budget categories\n==HET-1-CHUNK==\n\
            ## Common Mistakes and Corrections\n\n| Common Mistake | Correct Approach\
            \ |\n|----------------|------------------|\n| All travel as 44101 | Split\
            \ training registration (44201) from travel costs (44101) |\n| All IT\
            \ as 43201 | Hardware maintenance is 43301, software is 43201 |\n| Expensive\
            \ supplies as 41101 | Check if >100,000 JPY → 42101 |\n| Consulting as\
            \ 44201 | Training is 44201, consulting work is 44501 |\n| Combined contracts\
            \ single code | Split by primary purpose if amounts are known |\n==HET-1-CHUNK==\n\
            ## When to Escalate\n\nContact Finance Department when:\n\n- Transaction\
            \ > 1,000,000 JPY\n- Uncertain after using decision tree\n- New type of\
            \ transaction not in guidelines\n- Cross-departmental expense allocation\
            \ needed\n- International transaction with tax implications\n- Retroactive\
            \ correction needed\n\n**Finance Contact:**\n- Email: finance-inquiry@example.internal\n\
            - Phone: ext. 3333\n- Response time: Within 2 business days"
