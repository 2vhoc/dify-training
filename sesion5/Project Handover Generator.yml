            date\": \"\", \"event\": \"\", \"decision\": \"\"}],\n  \"key_contacts\"\
            : [{\"name\": \"\", \"organization\": \"\", \"role\": \"\", \"relationship_quality\"\
            : \"\"}],\n  \"pending_items\": [{\"item\": \"\", \"deadline\": \"\",\
            \ \"action_needed\": \"\"}],\n  \"critical_documents\": [{\"name\": \"\
            \", \"location\": \"\", \"purpose\": \"\"}],\n  \"important_decisions\"\
            : [{\"decision\": \"\", \"rationale\": \"\", \"approver\": \"\"}]\n}"
        selected: false
        structured_output:
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
            properties:
              critical_documents:
                items:
                  additionalProperties: false
                  properties:
                    location:
                      description: Where the document is stored
                      type: string
                    name:
                      description: Document name
                      type: string
                    purpose:
                      description: Purpose of the document
                      type: string
                  required:
                  - name
                  - location
                  - purpose
                  type: object
                type: array
              important_decisions:
                items:
                  additionalProperties: false
                  properties:
                    approver:
                      description: Person or authority approving the decision
                      type: string
                    decision:
                      description: Decision description
                      type: string
                    rationale:
                      description: Reasoning behind the decision
                      type: string
                  required:
                  - decision
                  - rationale
                  - approver
                  type: object
                type: array
              key_contacts:
                items:
                  additionalProperties: false
                  properties:
                    name:
                      description: Contact name
                      type: string
                    organization:
                      description: Organization or affiliation
                      type: string
                    relationship_quality:
                      description: Quality of relationship (e.g., strong, neutral,
                        weak)
                      type: string
                    role:
                      description: Role or title
                      type: string
                  required:
                  - name
                  - organization
                  - role
                  - relationship_quality
                  type: object
                type: array
              pending_items:
                items:
                  additionalProperties: false
                  properties:
                    action_needed:
                      description: Action required to complete the item
                      type: string
                    deadline:
                      description: Deadline (ISO 8601 recommended)
                      examples:
                      - '2026-03-01'
                      type: string
                    item:
                      description: Pending task or item
                      type: string
                  required:
                  - item
                  - deadline
                  - action_needed
                  type: object
                type: array
              timeline_events:
                items:
                  additionalProperties: false
                  properties:
                    date:
                      description: Date of the event (ISO 8601 recommended)
                      examples:
                      - '2026-02-25'
                      type: string
                    decision:
                      description: Decision made at the event
                      type: string
                    event:
                      description: Description of the event
                      type: string
                  required:
                  - date
                  - event
                  - decision
                  type: object
                type: array
            required:
            - timeline_events
            - key_contacts
            - pending_items
            - critical_documents
            - important_decisions
            title: ProjectSummary
            type: object
