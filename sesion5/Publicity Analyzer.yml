    - data:
        code: "def main(coverage_data, social_data=None) -> dict:\n    import json\n\
          \    from collections import Counter\n\n    # ---------- SAFE PARSE ----------\n\
          \    def safe_json_load(x):\n        if isinstance(x, str):\n          \
          \  try:\n                return json.loads(x)\n            except Exception:\n\
          \                raise ValueError(\"Input is string but not valid JSON\"\
          )\n        return x\n\n    coverage = safe_json_load(coverage_data)\n  \
          \  social = safe_json_load(social_data) if social_data is not None else\
          \ None\n\n    # ---------- HELPERS FOR FLEXIBLE SCHEMAS ----------\n   \
          \ def metrics_from_coverage_summary(summary: dict):\n        # pickup_rate\n\
          \        if isinstance(summary.get(\"pickup_rate\"), (int, float)):\n  \
          \          pickup_rate_val = float(summary[\"pickup_rate\"])\n        else:\n\
          \            mrs = summary.get(\"message_retention_stats\", {}) or {}\n\
          \            total = (mrs.get(\"full\", 0) or 0) + (mrs.get(\"partial\"\
          , 0) or 0) + (mrs.get(\"none\", 0) or 0)\n            if total:\n      \
          \          retained = (mrs.get(\"full\", 0) or 0) + (mrs.get(\"partial\"\
          , 0) or 0)\n                pickup_rate_val = retained / total * 100\n \
          \           else:\n                pickup_rate_val = 0.0\n\n        # avg_sentiment_score\
          \ 5..1\n        sentiment_map = {\n            \"Very Positive\": 5,\n \
          \           \"Positive\": 4,\n            \"Neutral\": 3,\n            \"\
          Negative\": 2,\n            \"Very Negative\": 1\n        }\n        sb\
          \ = summary.get(\"sentiment_breakdown\", {}) or {}\n        total_sent =\
          \ (\n            (sb.get(\"Very Positive\", 0) or 0) +\n            (sb.get(\"\
          Positive\", 0) or 0) +\n            (sb.get(\"Neutral\", 0) or 0) +\n  \
          \          (sb.get(\"Negative\", 0) or 0) +\n            (sb.get(\"Very\
          \ Negative\", 0) or 0)\n        )\n        if total_sent:\n            weighted\
          \ = (\n                (sb.get(\"Very Positive\", 0) or 0) * 5 +\n     \
          \           (sb.get(\"Positive\", 0) or 0) * 4 +\n                (sb.get(\"\
          Neutral\", 0) or 0) * 3 +\n                (sb.get(\"Negative\", 0) or 0)\
          \ * 2 +\n                (sb.get(\"Very Negative\", 0) or 0) * 1\n     \
          \       )\n            avg_sentiment = weighted / total_sent\n        else:\n\
          \            avg_sentiment = 0.0\n\n        # message_retention_rate 100/50/0\n\
          \        mrs = summary.get(\"message_retention_stats\", {}) or {}\n    \
          \    total_mr = (mrs.get(\"full\", 0) or 0) + (mrs.get(\"partial\", 0) or\
          \ 0) + (mrs.get(\"none\", 0) or 0)\n        if total_mr:\n            message_retention\
          \ = (\n                (mrs.get(\"full\", 0) or 0) * 100 +\n           \
          \     (mrs.get(\"partial\", 0) or 0) * 50 +\n                (mrs.get(\"\
          none\", 0) or 0) * 0\n            ) / total_mr\n        else:\n        \
          \    message_retention = 0.0\n\n        coverage_count_val = int(summary.get(\"\
          total_media\") or total_sent or total_mr or 0)\n\n        # by_media_type\
          \ (nếu có trong summary thì dùng trực tiếp)\n        by_media = summary.get(\"\
          by_media_type\") or {}\n\n        # Chuẩn hóa giá trị về int\n        if\
          \ isinstance(by_media, dict):\n            by_media = {str(k): int(v) for\
          \ k, v in by_media.items() if isinstance(v, (int, float))}\n\n        return\
          \ pickup_rate_val, avg_sentiment, message_retention, coverage_count_val,\
          \ by_media\n\n    def total_engagement_from_social_summary(social_summary:\
          \ dict):\n        if isinstance(social_summary.get(\"total_engagement\"\
          ), (int, float)):\n            return social_summary[\"total_engagement\"\
          ]\n        ebp = social_summary.get(\"engagement_by_platform\")\n      \
          \  if isinstance(ebp, dict):\n            return sum(v for v in ebp.values()\
          \ if isinstance(v, (int, float)))\n        tpp = social_summary.get(\"top_performing_posts\"\
          )\n        if isinstance(tpp, list):\n            total = 0\n          \
          \  for p in tpp:\n                val = p.get(\"engagement\")\n        \
          \        if isinstance(val, (int, float)):\n                    total +=\
          \ val\n            return total\n        return 0\n\n    # ---------- BRANCH\
          \ 1: coverage is LIST ----------\n    if isinstance(coverage, list):\n \
          \       coverage_count = len(coverage)\n\n        # pickup_rate\n      \
          \  retained = sum(1 for c in coverage if c.get(\"key_message_retained\"\
          ) in [\"Yes\", \"Partial\"])\n        pickup_rate = (retained / coverage_count\
          \ * 100) if coverage_count else 0.0\n\n        # avg_sentiment_score\n \
          \       sentiment_map = {\n            \"Very Positive\": 5,\n         \
          \   \"Positive\": 4,\n            \"Neutral\": 3,\n            \"Negative\"\
          : 2,\n            \"Very Negative\": 1\n        }\n        sentiment_scores\
          \ = [sentiment_map.get(c.get(\"sentiment\"), 3) for c in coverage]\n   \
          \     avg_sentiment_score = (sum(sentiment_scores) / len(sentiment_scores))\
          \ if sentiment_scores else 0.0\n\n        # message_retention_rate\n   \
          \     retention_map = {\"Yes\": 100, \"Partial\": 50, \"No\": 0}\n     \
          \   retention_scores = [retention_map.get(c.get(\"key_message_retained\"\
          , \"No\"), 0) for c in coverage]\n        message_retention_rate = (sum(retention_scores)\
          \ / len(retention_scores)) if retention_scores else 0.0\n\n        # by_media_type:\
          \ thử nhiều key phổ biến\n        keys_try = [\"media_type\", \"type\",\
          \ \"channel\", \"outlet_type\"]\n        counter = Counter()\n        for\
