      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: llm
      id: start-llm
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: end
      id: llm-end
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
    nodes:
    - data:
        selected: false
        title: START
        type: start
        variables:
        - default: ''
          hint: ''
          label: Equipment Type
          max_length: 48
          options:
          - Optical Network Unit (ONU)
          - Router
          - Business Phone (VoIP)
          - Network Switch
          - Wireless LAN Access Point
          - Fiber Optic Cable
          placeholder: ''
          required: true
          type: select
          variable: equipment_type
        - default: ''
          hint: ''
          label: Work Location
          max_length: 48
          options: []
          placeholder: ''
          required: false
          type: text-input
          variable: location
        - default: ''
          hint: ''
          label: Issue Description
          max_length: 48
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: issue_description
        - default: ''
          hint: ''
          label: Action Taken
          max_length: 48
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: action_taken
        - default: ''
          hint: ''
          label: Technician Name
          max_length: 48
          options: []
          placeholder: ''
          required: false
          type: text-input
          variable: technician_name
        - default: ''
          hint: ''
          label: Work Date
          max_length: 48
          options: []
          placeholder: ''
          required: false
          type: text-input
          variable: work_date
      height: 239
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: true
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: null
        memory: null
        model:
          completion_params:
            stop: []
          mode: chat
          name: gpt-oss:120b
          provider: langgenius/ollama/ollama
        prompt_template:
        - id: d94d6c91-0e1a-4570-b3fd-859cc46a7bce
          role: user
          text: 'Based on the following information, create a standardized maintenance
            work report in Company format.


            [Input Information]

            - Equipment Type: {{#start.equipment_type#}}

            - Work Location: {{#start.location#}}

            - Issue Description: {{#start.issue_description#}}

            - Action Taken: {{#start.action_taken#}}

            - Technician: {{#start.technician_name#}}

            - Work Date: {{#start.work_date#}}


            [Report Format]

            Please create the report with the following structure:


            1. Report Header (work date, technician, work location)

            2. Issue Summary (concise 1-2 sentences)

            3. Issue Details (including root cause analysis)

            4. Actions Taken (numbered step-by-step)

            5. Verification Results (post-work confirmation details)

            6. Future Recommendations (preventive maintenance suggestions)

            7. Remarks


            Write in a professional, technically accurate, and concise style.'
        selected: false
        title: LLM
        type: llm
        vision:
          configs: null
          enabled: false
          variable_selector: null
      height: 88
      id: llm
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      selected: false
      type: custom
      width: 242
    - data:
        outputs:
        - value_selector:
          - llm
          - text
          variable: result
        selected: false
        title: END
        type: end
      height: 88
      id: end
      position:
        x: 680
        y: 282
      positionAbsolute:
        x: 680
        y: 282
      type: custom
      width: 242
    viewport:
